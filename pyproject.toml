# pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eventus_publicus"]

[project]
name = "eventus-publicus"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Collects limited local events from providers for personal use"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Sebastien Lenard", email = "sebastien.lenard@gmail.com" }
]
dependencies = [
    "bs4>=0.0.2",
    "click>=8.4.2",
    "playwright>=1.61.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
]

[project.scripts]
eventus-publicus = "eventus_publicus.__main__:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    "uv.lock"
]
unsafe-fixes = false

[tool.ruff.lint]
select = ["E", "F", "I", "B", "A", "ANN", "ARG", "BLE", "C4", "C90", "COM", "CPY", "D", "DTZ", "EM", "ERA", "EXE", "FA", "FBT", "FIX", "FLY", "FURB", "G", "ICN", "INP", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF", "UP", "T10", "T20", "TC", "TD", "TID", "TRY", "W", "YTT"]
extend-ignore = ["D107"]
fixable = ["ALL"]
unfixable = []
allowed-confusables = ["ℹ"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001", # Allow apparently non accessed arguments
    "ARG005", # Allow apparently non accessed arguments
    "BLE001",  # Allow broad exception catching (great for checking fallback paths)
    "FBT001", # Allow boolean positional arguments
    "FBT002", # Allow boolean default positional arguments
    "PLR2004", # Allow numerical values not being constant
    "PLW0120", # Allow loose control structures if an LLM generated messy loop edge-case tests
    "PLR0913", # Allow many arguments
    "S101",    # Allow 'assert' statements (otherwise bandit flags every single test)
    "SLF001", # Access to private member
]
"__init__.py" = ["D104"]
"__main__.py" = ["D100", "D104"]

[tool.ruff.lint.flake8-copyright]
author = "Sebastien Lenard <sebastien.lenard@gmail.com> and Contributors"
notice-rgx = '(?i)SPDX-FileCopyrightText:\s*2026\s*'

[tool.ruff.format]
quote-style = "double"
